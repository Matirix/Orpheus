[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orpheus"
version = "0.1.0"
description = "Piano practice app with real-time detection and YouTube transcription"
requires-python = ">=3.9,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "yt-dlp[default]",
]

[project.optional-dependencies]
ml = [
  # Floor, not a pin: rocm6.4 only ships cp39-cp311 wheels before 2.8, so a
  # lower torch resolves to something uv cannot install on Python 3.12.
  "torch>=2.8",
  # Torch depends on this, but the ROCm index is `explicit = true` and PyPI
  # stops at 2.1.0 — it has to be a direct dependency for the [tool.uv.sources]
  # mapping to apply, or the resolver cannot see 3.5.1 at all.
  "pytorch-triton-rocm; sys_platform == 'linux'",
  "librosa",
  "soundfile",
  "piano-transcription-inference",
  "numpy<2",
]

# uv sync installs this group by default, so tests never depend on the ml
# extras being present.
[dependency-groups]
dev = ["pytest"]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }
pytorch-triton-rocm = { index = "pytorch-rocm", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
